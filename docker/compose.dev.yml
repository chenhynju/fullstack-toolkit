name: toolkit-saas-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: local-migration-only
      POSTGRES_DB: toolkit
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - dev-pg:/var/lib/postgresql/data
      - ./init-dev.sql:/docker-entrypoint-initdb.d/01-app-role.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d toolkit']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:6379:6379']
    command: ['redis-server', '--maxmemory', '64mb', '--maxmemory-policy', 'noeviction']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  dev-pg:
