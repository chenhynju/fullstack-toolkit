name: fullstack-toolkit
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?private migration password required}
      POSTGRES_DB: toolkit
    volumes:
      - saas-pg:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 320m
    cpus: 0.6
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d toolkit']
      interval: 5s
      timeout: 3s
      retries: 30
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  redis:
    image: redis:7-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '64mb',
        '--maxmemory-policy',
        'noeviction'
      ]
    volumes: [saas-redis:/data]
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.2
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging
  migrate:
    image: fullstack-toolkit-migrate:${RELEASE_TAG:?immutable release required}
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      target: migrate
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?private migration URL required}
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
    mem_limit: 384m
    logging: *logging
  api:
    image: fullstack-toolkit-api:${RELEASE_TAG:?immutable release required}
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?nonprivileged application URL required}
      REDIS_URL: redis://redis:6379
      APP_ORIGIN: ${APP_ORIGIN:?HTTPS origin required}
      RATE_LIMIT_NAMESPACE: toolkit-saas-production
      TRUST_PROXY: 172.16.0.0/12
    ports: ['127.0.0.1:${API_PORT:-3181}:3001']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
  web:
    image: fullstack-toolkit-web:${RELEASE_TAG:?immutable release required}
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        API_INTERNAL_URL: http://api:3001
    ports: ['127.0.0.1:${WEB_PORT:-3180}:3000']
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
volumes:
  saas-pg:
  saas-redis:
