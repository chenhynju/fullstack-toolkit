services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - '3001:3001'

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - '3000:3000'
    environment:
      # 容器网络内通过服务名访问 api（rewrites 在构建时读取该变量）
      - API_INTERNAL_URL=http://api:3001
    depends_on:
      - api
