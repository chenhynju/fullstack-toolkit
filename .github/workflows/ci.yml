name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 质量门禁：任一检查失败即无法合并（配合分支保护 Required status checks）──
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # turbo 增量构建需要完整提交历史
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint（含自定义 ESLint 规则）
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests（含覆盖率阈值）
        run: pnpm --filter @repo/db db:push && pnpm test
      - name: Build
        run: pnpm build
      - name: Bundle budget（包体积门禁）
        run: pnpm size-check

  # ── 端到端测试：真实浏览器跑通 首页 → API 全链路 ──
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm e2e
