name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DATABASE_URL: postgresql://toolkit_app:ci-application-only@localhost:5432/toolkit
  TEST_ADMIN_DATABASE_URL: postgresql://postgres:ci-migration-only@localhost:5432/toolkit
  TEST_APP_PASSWORD: ci-application-only
  REDIS_URL: redis://localhost:6379
  APP_ORIGIN: http://localhost:3000
  API_INTERNAL_URL: http://127.0.0.1:3001
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  quality-gate:
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-migration-only
          POSTGRES_DB: toolkit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d toolkit"
          --health-interval 5s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 30
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-node22-pnpm11-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node22-pnpm11-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - run: node scripts/provision-dev-role.mjs
      - name: Migrate isolated PostgreSQL
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_ADMIN_DATABASE_URL }}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
      - run: node scripts/verify-pins.mjs
      - run: pnpm format:check
      - run: pnpm exec turbo run lint typecheck test
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm build
      - run: node --test scripts/tests/*.test.mjs
      - run: pnpm size-check && node scripts/check-entry-budget.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            apps/api/coverage
            apps/web/coverage
            packages/ui/coverage
            packages/utils/coverage
  e2e:
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-migration-only
          POSTGRES_DB: toolkit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d toolkit"
          --health-interval 5s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 30
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: ci-only-ephemeral-admin-629174
      E2E_ADMIN_EMAIL: ci-admin@example.com
      E2E_ADMIN_PASSWORD: ci-only-ephemeral-admin-629174
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/provision-dev-role.mjs
      - name: Migrate isolated PostgreSQL
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_ADMIN_DATABASE_URL }}
      - run: pnpm db:seed
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @repo/web exec playwright install-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: |
            apps/web/playwright-report
            apps/admin/playwright-report
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
